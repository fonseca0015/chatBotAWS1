name: CI - Integridade e Build do ERP Helpper

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar Sintaxe do Python (py_compile)
        run: |
          python -m py_compile main.py

      - name: Validação Estática com Flake8 (Erros críticos de sintaxe)
        run: |
          # Para a execução se houver erros de sintaxe do Python ou nomes indefinidos
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Avisos leves (complexidade, estilo) sem quebrar o build
          flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Validar Integridade do Arquivo knowledge_base.json
        run: |
          python -c "
          import json, os
          file_path = 'knowledge_base.json'
          if not os.path.exists(file_path):
              raise FileNotFoundError(f'{file_path} não foi encontrado.')
          with open(file_path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f'knowledge_base.json validado com sucesso! Total de itens raiz: {len(data)}')
          "

      - name: Verificar Existência de Arquivos Críticos de Configuração
        run: |
          test -f .env.example || { echo ".env.example ausente"; exit 1; }
          test -f index.html || { echo "index.html ausente"; exit 1; }
          echo "Todos os arquivos essenciais estão presentes no repositório."
