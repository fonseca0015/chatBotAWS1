name: CI - Integridade e Build do ERP Helpper

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Validar Sintaxe dos Scripts Python
        run: |
          python -m py_compile main.py
          python -m py_compile test_api.py

      - name: Validação Estática com Flake8
        run: |
          # Interrompe o build se houver erros críticos de sintaxe
          flake8 main.py test_api.py --count --select=E9,F63,F7,F82 --show-source --statistics
          # Alertas leves sem falhar
          flake8 main.py test_api.py --count --exit-zero --max-complexity=15 --max-line-length=127 --statistics

      - name: Validar Integridade da Base de Conhecimento JSON
        run: |
          python -c "
          import json, os
          file_path = 'knowledge_base.json'
          if not os.path.exists(file_path):
              raise FileNotFoundError(f'{file_path} não encontrado.')
          with open(file_path, 'r', encoding='utf-8') as f:
              data = json.load(f)
          print(f'knowledge_base.json validado com sucesso! Total de artigos: {len(data)}')
          "

      - name: Validar Integridade do Workflow do n8n
        run: |
          python -c "
          import json, os
          file_path = 'n8n/workflow_uno_erp_helpper.json'
          if not os.path.exists(file_path):
              raise FileNotFoundError(f'{file_path} não encontrado.')
          with open(file_path, 'r', encoding='utf-8') as f:
              wf = json.load(f)
          assert 'nodes' in wf, 'O workflow precisa conter nodes.'
          print(f'Workflow n8n validado com sucesso! Total de nós: {len(wf[\"nodes\"])}')
          "

      - name: Verificar Existência de Arquivos Críticos de Configuração e Docs
        run: |
          test -f .env.example || { echo ".env.example ausente"; exit 1; }
          test -f index.html || { echo "index.html ausente"; exit 1; }
          test -f README.md || { echo "README.md ausente"; exit 1; }
          test -d docs || { echo "pasta docs ausente"; exit 1; }
          echo "Todos os arquivos essenciais estão presentes no repositório."
