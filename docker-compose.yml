version: '3.8'

services:
  erp-helpper-search-api:
    build: .
    container_name: erp-helpper-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - PORT=5000
    volumes:
      - ./base_de_conhecimento_db:/app/base_de_conhecimento_db
      - ./knowledge_base.json:/app/knowledge_base.json
